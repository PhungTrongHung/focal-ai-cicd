name: FOCAL AI CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test tools
        run: python -m pip install pytest

      - name: Run CI tests
        run: python -m pytest tests/ -v

      - name: Check Python source syntax
        run: python -m compileall -q src

      - name: Check Docker installation
        run: docker --version

      - name: Build FOCAL Docker image
        run: docker build --tag hung5705/focal-ai:latest .

      - name: Check Docker images
        run: docker image ls

      - name: Smoke test FOCAL container
        run: docker run --rm hung5705/focal-ai:latest

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: hung5705
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push hung5705/focal-ai:latest